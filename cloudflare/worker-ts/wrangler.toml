name = "milterra-api-staging"
account_id = "24e366c9448ef4c466bffe6f17efa51b"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "staging"
ALLOW_TEST_AUTH = "false"
CORS_ORIGINS = "https://milterra-staging.pages.dev,https://milterrafoods.com,https://www.milterrafoods.com,https://farmers.milterrafoods.com,https://farmers.katixo.com"
CUSTOMER_AUTH_ENABLED = "true"
TEST_COMMERCE_ENABLED = "false"
LIVE_COD_ENABLED = "true"
SIMULATION_ENABLED = "false"
STOREFRONT_BASE_URL = "https://milterrafoods.com"

[[d1_databases]]
binding = "DB"
database_name = "milterra-staging"
database_id = "a21abccf-65eb-4305-b27d-5c04efad65b1"
migrations_dir = "migrations"

[[services]]
binding = "PASSWORD_HASHER"
service = "milterra-password-hasher"

# ============================================================================
# DEV ENVIRONMENT (Development & Testing)
# ============================================================================
[env.dev]
name = "milterra-api-dev"
workers_dev = true

[env.dev.vars]
ENVIRONMENT = "development"
ALLOW_TEST_AUTH = "true"
CORS_ORIGINS = "http://localhost:3000,http://localhost:8080,http://127.0.0.1:8000,http://localhost:5000,http://localhost:8000,https://milterra-staging.pages.dev,https://farmers.milterrafoods.com"
CUSTOMER_AUTH_ENABLED = "true"
TEST_COMMERCE_ENABLED = "true"
LIVE_COD_ENABLED = "true"
SIMULATION_ENABLED = "true"
STOREFRONT_BASE_URL = "http://localhost:3000"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "milterra-dev"
database_id = "ebf84151-b3b0-494c-810d-32a453ccc13a"
migrations_dir = "migrations"

[[env.dev.services]]
binding = "PASSWORD_HASHER"
service = "milterra-password-hasher"
