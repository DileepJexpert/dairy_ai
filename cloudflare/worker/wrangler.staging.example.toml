# Copy to a private staging config, replace the D1 ID and storefront origin,
# then supply JWT/provider secrets through Wrangler secret commands.
# This example is intentionally not deployable as committed.
name = "milterra-api-staging"
main = "src/main.py"
compatibility_date = "2026-09-25"
compatibility_flags = ["python_workers"]
workers_dev = true

[vars]
ENVIRONMENT = "staging"
ALLOW_TEST_AUTH = false
CUSTOMER_AUTH_ENABLED = "false"
TEST_COMMERCE_ENABLED = "false" # Mutually exclusive with live COD
LIVE_COD_ENABLED = "false" # Enable for real COD only after configuring D1 delivery_policy
SIMULATION_ENABLED = "false" # Disabled on the live COD Worker
# Enable customer auth only after runtime acceptance and setting AUTH_SECRET.
CORS_ORIGINS = "https://replace-with-your-staging-pages-host.example.invalid"

[[d1_databases]]
binding = "DB"
database_name = "milterra-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Deploy the private password-hasher Worker before enabling customer accounts.
# [[services]]
# binding = "PASSWORD_HASHER"
# service = "milterra-password-hasher"
