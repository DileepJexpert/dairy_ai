name: dairy_ai
description: DairyAI - India's first full-stack dairy problem solver.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.0.0
  dio: ^5.4.0
  file_selector: ^1.1.0
  flutter_secure_storage: ^9.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0

dev_dependencies:
